name: Deploy to prod

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1

jobs:
  deploy-infrastructure:
    name: deploy-infrastructure
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      id-token: write
      contents: read
    outputs:
      ecr_repository_url: ${{ steps.tf-outputs.outputs.ecr_repository_url }}
      ecs_cluster_name: ${{ steps.tf-outputs.outputs.ecs_cluster_name }}
      ecs_service_name: ${{ steps.tf-outputs.outputs.ecs_service_name }}
      frontend_bucket_name: ${{ steps.tf-outputs.outputs.frontend_bucket_name }}
      cloudfront_distribution_id: ${{ steps.tf-outputs.outputs.cloudfront_distribution_id }}
      cloudfront_domain_name: ${{ steps.tf-outputs.outputs.cloudfront_domain_name }}
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_INFRA_ROLE_ARN }}
          role-session-name: nib-demo-app-prod-infra-deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Init
        run: terraform init -input=false

      - name: Validate
        run: terraform validate

      - name: Plan
        run: terraform plan -input=false -out=tfplan

      - name: Apply
        run: terraform apply -input=false -auto-approve tfplan

      - name: Read outputs
        id: tf-outputs
        run: |
          {
            echo "ecr_repository_url=$(terraform output -raw ecr_repository_url)"
            echo "ecs_cluster_name=$(terraform output -raw ecs_cluster_name)"
            echo "ecs_service_name=$(terraform output -raw ecs_service_name)"
            echo "frontend_bucket_name=$(terraform output -raw frontend_bucket_name)"
            echo "cloudfront_distribution_id=$(terraform output -raw cloudfront_distribution_id)"
            echo "cloudfront_domain_name=$(terraform output -raw cloudfront_domain_name)"
          } >> "$GITHUB_OUTPUT"

  deploy-application:
    name: deploy-application
    runs-on: ubuntu-latest
    needs: deploy-infrastructure
    environment: prod
    permissions:
      id-token: write
      contents: read
    env:
      ECR_REPOSITORY_URL: ${{ needs.deploy-infrastructure.outputs.ecr_repository_url }}
      ECS_CLUSTER_NAME: ${{ needs.deploy-infrastructure.outputs.ecs_cluster_name }}
      ECS_SERVICE_NAME: ${{ needs.deploy-infrastructure.outputs.ecs_service_name }}
      FRONTEND_BUCKET_NAME: ${{ needs.deploy-infrastructure.outputs.frontend_bucket_name }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ needs.deploy-infrastructure.outputs.cloudfront_distribution_id }}
      CLOUDFRONT_DOMAIN_NAME: ${{ needs.deploy-infrastructure.outputs.cloudfront_domain_name }}
      APP_VERSION: "0.1.0"
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APP_ROLE_ARN }}
          role-session-name: nib-demo-app-prod-app-deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push the backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.ECR_REPOSITORY_URL }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Register a new task-definition revision
        run: |
          set -euo pipefail

          CURRENT_TASK_DEF_ARN=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER_NAME" \
            --services "$ECS_SERVICE_NAME" \
            --query 'services[0].taskDefinition' --output text)

          aws ecs describe-task-definition \
            --task-definition "$CURRENT_TASK_DEF_ARN" \
            --query 'taskDefinition' > task-def.json

          jq \
            --arg image "$ECR_REPOSITORY_URL:$GITHUB_SHA" \
            --arg app_version "$APP_VERSION" \
            --arg git_sha "$GITHUB_SHA" \
            '.containerDefinitions[0].image = $image
             | .containerDefinitions[0].environment = (
                 .containerDefinitions[0].environment
                 | map(
                     if .name == "APP_VERSION" then .value = $app_version
                     elif .name == "GIT_SHA" then .value = $git_sha
                     else . end
                   )
               )
             | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
            task-def.json > new-task-def.json

          NEW_TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://new-task-def.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)

          echo "NEW_TASK_DEF_ARN=$NEW_TASK_DEF_ARN" >> "$GITHUB_ENV"

      - name: Update the service and wait for stability
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER_NAME" \
            --service "$ECS_SERVICE_NAME" \
            --task-definition "$NEW_TASK_DEF_ARN" \
            --desired-count 2 \
            --force-new-deployment > /dev/null

          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER_NAME" \
            --services "$ECS_SERVICE_NAME"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          printf '{"apiBaseUrl":""}' > dist/config.json

      - name: Upload fingerprinted assets (long-lived cache, never deleted yet)
        working-directory: frontend
        run: |
          aws s3 sync dist/assets "s3://$FRONTEND_BUCKET_NAME/assets" \
            --cache-control "public,max-age=31536000,immutable"

      - name: Upload the SPA shell and runtime config (no-store)
        working-directory: frontend
        run: |
          aws s3 cp dist/index.html "s3://$FRONTEND_BUCKET_NAME/index.html" --cache-control "no-store"
          aws s3 cp dist/config.json "s3://$FRONTEND_BUCKET_NAME/config.json" --cache-control "no-store"

      - name: Remove assets no longer referenced by the new shell
        working-directory: frontend
        run: |
          aws s3 sync dist/assets "s3://$FRONTEND_BUCKET_NAME/assets" \
            --cache-control "public,max-age=31536000,immutable" \
            --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"

      - name: Smoke test
        run: ./scripts/smoke.sh "https://$CLOUDFRONT_DOMAIN_NAME"
