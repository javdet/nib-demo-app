name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest -q

      - name: Migrations match the models
        env:
          DATABASE_URL: sqlite+aiosqlite:///./check.db
        run: |
          alembic upgrade head
          alembic check

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  infrastructure:
    name: Infrastructure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.5"

      - name: Terraform fmt
        working-directory: infra/terraform
        run: terraform fmt -check -recursive

      # No backend, no credentials: this only checks that the configuration
      # itself is well-formed, the same thing deploy-infrastructure.yml does
      # before it ever touches the real backend.
      - name: Terraform init
        working-directory: infra/terraform
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        working-directory: infra/terraform
        run: terraform validate

      - name: Install cfn-lint
        run: pip install --quiet cfn-lint

      - name: Validate the bootstrap CloudFormation template
        run: cfn-lint infra/bootstrap/template.yml

  images:
    name: Images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Built but not pushed: the ECR push and the S3 sync belong to the deploy
      # workflow, which lands with the infrastructure code.
      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  stack:
    name: Stack smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bring the stack up
        run: docker compose up --build -d

      - name: Wait for the API
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/api/health/ready && exit 0
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Catalogue, cart and checkout
        run: ./scripts/smoke.sh http://localhost:8080

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs
