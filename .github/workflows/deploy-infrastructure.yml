name: Deploy Infrastructure

# terraform-plan runs on every push/PR that touches infra/terraform/**, so a
# plan is visible before anything merges. terraform-apply only ever runs from
# an explicit workflow_dispatch with apply=true, and only after the
# `production` environment's protection rules (required reviewers) approve
# it - a push to main plans, it never applies on its own.
on:
  push:
    branches: [main]
    paths:
      - "infra/terraform/**"
      - ".github/workflows/deploy-infrastructure.yml"
  pull_request:
    paths:
      - "infra/terraform/**"
      - ".github/workflows/deploy-infrastructure.yml"
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply the plan (requires production environment approval)"
        type: boolean
        required: true
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-infrastructure-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_VERSION: "1.10.5"
  AWS_REGION: us-east-1
  TF_STATE_KEY: nib-demo/prod/terraform.tfstate

defaults:
  run:
    working-directory: infra/terraform

jobs:
  terraform-plan:
    name: Plan
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Account id
        id: account
        run: echo "id=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_OUTPUT"

      - name: Terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=nib-demo-terraform-state-${{ steps.account.outputs.id }}" \
            -backend-config="key=${{ env.TF_STATE_KEY }}" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: Terraform format
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -input=false -out=tfplan

      - uses: actions/upload-artifact@v4.6.2
        with:
          name: tfplan
          path: infra/terraform/tfplan
          retention-days: 5

  terraform-apply:
    name: Apply
    needs: terraform-plan
    if: github.event_name == 'workflow_dispatch' && inputs.apply
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Account id
        id: account
        run: echo "id=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_OUTPUT"

      - name: Terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=nib-demo-terraform-state-${{ steps.account.outputs.id }}" \
            -backend-config="key=${{ env.TF_STATE_KEY }}" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - uses: actions/download-artifact@v4.3.0
        with:
          name: tfplan
          path: infra/terraform

      - name: Terraform apply
        run: terraform apply -input=false tfplan
