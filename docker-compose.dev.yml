# Backing services only, with the API reloading on save.
#
#   make dev      # db + backend on :8000
#   make web      # vite dev server on :5173, proxying /api to :8000
#
# The frontend deliberately runs on the host: HMR is the whole point.

name: nib-shop-dev

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nib
      POSTGRES_PASSWORD: nib
      POSTGRES_DB: nibshop
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nib -d nibshop"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    command:
      - uvicorn
      - app.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --reload
    environment:
      DATABASE_URL: postgresql+asyncpg://nib:nib@db:5432/nibshop
      ENVIRONMENT: local-dev
      DB_ECHO: "${DB_ECHO:-false}"
      CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
    volumes:
      - ./backend/app:/app/app:ro
      - ./backend/alembic:/app/alembic:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"

volumes:
  pgdata-dev:
